[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "telegram-ingestion"
version = "0.1.0"
description = "Local-first Telegram ingestion subsystem for narrative analysis"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
license = { text = "Proprietary" }
dependencies = [
    "openai>=2.26.0",
    "tdjson>=1.8.62; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_ingest"]
